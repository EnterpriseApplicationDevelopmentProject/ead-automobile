spring.application.name=ead-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ead_automobilen
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=dila2001

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# H2 Console (disabled for production)
spring.h2.console.enabled=false

# Server Configuration
server.port=8080

# Spring Security Default User (Development Only)
spring.security.user.name=admin
spring.security.user.password=admin123

# Security (JWT Configuration - you'll need to update these)
jwt.secret=your-secret-key-here-please-change-this-to-a-secure-random-string
jwt.expiration=86400000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
